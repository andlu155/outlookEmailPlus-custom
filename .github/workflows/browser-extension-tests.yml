name: Browser Extension Tests

on:
  push:
    branches: ["main", "master"]
    paths:
      - "browser-extension/**"
      - "tests/browser-extension/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-extension-tests.yml"
  pull_request:
    paths:
      - "browser-extension/**"
      - "tests/browser-extension/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-extension-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run browser extension tests
        run: npm test
