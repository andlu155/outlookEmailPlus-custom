    <!-- ==================== 精简系统设置弹窗（3 Tab，全部悬停注释） ==================== -->
    <div class="modal" id="settingsModal" onclick="if(event.target === this) hideSettingsModal()">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>⚙️ 系统设置</h3>
                <button type="button" class="modal-close" onclick="hideSettingsModal()">&times;</button>
            </div>

            <div class="settings-tab-nav" id="settingsTabNav">
                <button type="button" class="settings-tab active" data-tab="basic" onclick="switchSettingsTab('basic')"
                    data-tip="管理登录密码、全局网络代理以及验证码 AI 增强配置">🔐 基础与代理</button>
                <button type="button" class="settings-tab" data-tab="automation" onclick="switchSettingsTab('automation')"
                    data-tip="管理 Outlook 令牌定时保活刷新以及 Telegram 新邮件推送">🔔 刷新与推送</button>
                <button type="button" class="settings-tab" data-tab="integration" onclick="switchSettingsTab('integration')"
                    data-tip="管理 Cloudflare 临时邮箱 Worker、对外单 Key API 及 SQLite 数据库备份">⚡ 临时邮箱与系统</button>
            </div>

            <div class="modal-body" id="settingsModalBody">
                <!-- Tab 1: 基础与代理 -->
                <div class="settings-tab-pane active" data-tab="basic">
                    <div class="settings-section">
                        <div class="settings-section-title">🔑 登录安全</div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label class="form-label" for="settingsPassword"
                                data-tip="修改本系统管理员登录密码（至少 8 位），留空表示保持当前密码不变">新登录密码</label>
                            <input type="password" class="form-input" id="settingsPassword" placeholder="留空不修改（至少 8 位）" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="settings-section">
                        <div class="settings-section-title">🌐 全局代理</div>
                        <div class="form-group">
                            <label class="form-label" style="cursor:pointer;"
                                data-tip="开启后默认作用于所有外网收信（Graph / IMAP）、令牌刷新、CF 临时邮箱、验证码 AI 与 Telegram 推送；本地/内网地址自动直连，各分组可覆盖或强制直连">
                                <input type="checkbox" id="settingsGlobalProxyEnabled" style="accent-color:var(--clr-primary);">
                                <span>启用全局默认代理</span>
                            </label>
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label class="form-label" for="settingsGlobalProxyUrl"
                                data-tip="支持 http://、https://、socks4://、socks5://、socks5h://（可带账号密码，数据库加密存储）">全局代理地址</label>
                            <div class="form-row-inline">
                                <input type="text" class="form-input" id="settingsGlobalProxyUrl"
                                    placeholder="http://host:port 或 socks5://user:pass@host:port" style="flex:1;min-width:240px;">
                                <button type="button" class="btn btn-sm" id="btnTestGlobalProxy" onclick="testGlobalProxy()"
                                    data-tip="实时探测所填代理服务器的网络连通性与延迟">🔗 测试连通性</button>
                                <span id="globalProxyTestResult" style="font-size:12.5px;"></span>
                            </div>
                        </div>
                    </div>

                    <div class="settings-section">
                        <div class="settings-section-title">🤖 验证码 AI 增强</div>
                        <div class="form-group">
                            <label class="form-label" style="cursor:pointer;"
                                data-tip="本地规则无法高置信度提取验证码或验证链接时，自动调用 OpenAI 兼容大模型兜底识别">
                                <input type="checkbox" id="settingsVerificationAiEnabled" style="accent-color:var(--clr-primary);">
                                <span>启用 AI 兜底提取验证码</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="settingsVerificationAiBaseUrl"
                                data-tip="填写 OpenAI 兼容接口地址，例如 https://api.openai.com/v1">AI Base URL</label>
                            <input type="text" class="form-input" id="settingsVerificationAiBaseUrl" placeholder="https://api.openai.com/v1">
                        </div>
                        <div class="form-row-inline" style="gap:10px;margin-bottom:12px;">
                            <div style="flex:1;min-width:200px;">
                                <label class="form-label" for="settingsVerificationAiApiKey"
                                    data-tip="AI 服务商 API Key（数据库加密存储，保留脱敏占位符提交表示不修改）">AI API Key</label>
                                <input type="password" class="form-input" id="settingsVerificationAiApiKey" placeholder="sk-..." autocomplete="off">
                            </div>
                            <div style="flex:1;min-width:180px;">
                                <label class="form-label" for="settingsVerificationAiModel"
                                    data-tip="调用的模型 ID，例如 gpt-4o-mini、deepseek-chat 等">模型 ID</label>
                                <input type="text" class="form-input" id="settingsVerificationAiModel" placeholder="gpt-4o-mini">
                            </div>
                        </div>
                        <div class="form-row-inline">
                            <button type="button" class="btn btn-sm" id="btnTestVerificationAi" onclick="testVerificationAiConfig()"
                                data-tip="向当前填写的 AI 接口发送一次最小探测请求，验证地址、Key 与模型是否可用">🧪 测试 AI 配置</button>
                            <span id="verificationAiTestResult" style="font-size:12.5px;"></span>
                        </div>
                    </div>
                </div>

                <!-- Tab 2: 刷新与推送 -->
                <div class="settings-tab-pane" data-tab="automation">
                    <div class="settings-section">
                        <div class="settings-section-title">🔄 Token 定时保活刷新</div>
                        <div class="form-group">
                            <label class="form-label" style="cursor:pointer;"
                                data-tip="按固定周期在后台自动刷新所有 Outlook 账号的 OAuth2 Refresh Token，防止长期未使用导致令牌过期">
                                <input type="checkbox" id="enableScheduledRefresh" style="accent-color:var(--clr-primary);">
                                <span>启用后台定时刷新</span>
                            </label>
                        </div>
                        <div class="form-row-inline" style="gap:12px;">
                            <div style="flex:1;min-width:160px;">
                                <label class="form-label" for="refreshIntervalDays"
                                    data-tip="每隔多少天执行一次全量保活刷新（范围 1-90 天，建议 7-30 天）">刷新周期（天）</label>
                                <input type="number" class="form-input" id="refreshIntervalDays" min="1" max="90" value="30">
                            </div>
                            <div style="flex:1;min-width:160px;">
                                <label class="form-label" for="refreshDelaySeconds"
                                    data-tip="批量刷新时每个账号之间的等待间隔（范围 0-60 秒，用于降低微软接口风控概率）">单号间隔（秒）</label>
                                <input type="number" class="form-input" id="refreshDelaySeconds" min="0" max="60" value="5">
                            </div>
                        </div>
                    </div>

                    <div class="settings-section">
                        <div class="settings-section-title">📬 Telegram 新邮件推送</div>
                        <div class="form-group">
                            <label class="form-label" for="telegramBotToken"
                                data-tip="从 @BotFather 获取的 Telegram Bot Token；网络请求自动复用「基础与代理」中的全局代理，留空保存可关闭推送">Bot Token</label>
                            <input type="password" class="form-input" id="telegramBotToken" placeholder="123456:ABC-DEF...（留空关闭）" autocomplete="off">
                        </div>
                        <div class="form-row-inline" style="gap:12px;margin-bottom:12px;">
                            <div style="flex:1;min-width:180px;">
                                <label class="form-label" for="telegramChatId"
                                    data-tip="接收推送消息的个人或群组 Chat ID（可向 @userinfobot 获取）">Chat ID</label>
                                <input type="text" class="form-input" id="telegramChatId" placeholder="例如 123456789">
                            </div>
                            <div style="flex:1;min-width:160px;">
                                <label class="form-label" for="telegramPollInterval"
                                    data-tip="后台轮询已开启推送的邮箱并转发新邮件的间隔秒数（10-86400 秒，建议 60-300 秒）">轮询间隔（秒）</label>
                                <input type="number" class="form-input" id="telegramPollInterval" min="10" max="86400" value="300">
                            </div>
                        </div>
                        <div class="form-row-inline">
                            <button type="button" class="btn btn-sm" id="btnTestTelegram" onclick="testTelegramPush()"
                                data-tip="向已保存的 Bot Token 与 Chat ID 发送一条测试通知（请先点击保存设置）">📨 发送测试消息</button>
                        </div>
                    </div>
                </div>

                <!-- Tab 3: 临时邮箱与系统 -->
                <div class="settings-tab-pane" data-tab="integration">
                    <div class="settings-section">
                        <div class="settings-section-title">☁ Cloudflare Temp Mail Worker</div>
                        <div class="form-group">
                            <label class="form-label" for="settingsCfWorkerBaseUrl"
                                data-tip="你部署的 Cloudflare Temp Email Worker 根地址（例如 https://mail.example.com），支持自动复用全局代理">Worker 地址</label>
                            <input type="text" class="form-input" id="settingsCfWorkerBaseUrl" placeholder="https://temp-mail.example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="settingsCfWorkerAdminKey"
                                data-tip="Worker 环境变量中配置的 ADMIN_PASSWORDS 管理员密钥（数据库加密存储）">Admin Key</label>
                            <input type="password" class="form-input" id="settingsCfWorkerAdminKey" placeholder="输入 CF Worker Admin Key" autocomplete="off">
                        </div>
                        <div class="form-row-inline" style="margin-bottom:10px;">
                            <button type="button" class="btn btn-sm" id="btnSyncCfWorkerDomains" onclick="syncCfWorkerDomains()"
                                data-tip="自动连接 Worker 拉取已绑定的可用域名列表并回填到下方">🔄 同步可用域名</button>
                            <span id="cfSyncResult" style="font-size:12.5px;"></span>
                        </div>
                        <div class="form-row-inline" style="gap:10px;">
                            <div style="flex:1.5;min-width:200px;">
                                <label class="form-label" for="settingsCfWorkerDomains"
                                    data-tip="由「同步可用域名」自动拉取的只读域名列表">已同步域名（只读）</label>
                                <input type="text" class="form-input" id="settingsCfWorkerDomains" readonly placeholder="点击上方同步域名">
                            </div>
                            <div style="flex:1;min-width:150px;">
                                <label class="form-label" for="settingsCfWorkerDefaultDomain"
                                    data-tip="未手动选择域名时默认使用的 CF 临时邮箱域名">默认域名（只读）</label>
                                <input type="text" class="form-input" id="settingsCfWorkerDefaultDomain" readonly placeholder="自动选择">
                            </div>
                        </div>
                    </div>

                    <div class="settings-section">
                        <div class="settings-section-title">🔑 对外开放 API（单 Key）</div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label class="form-label" for="settingsExternalApiKey"
                                data-tip="供外部脚本通过 X-API-Key 调用 /api/external/* 接口读取邮件与验证码；清空并保存即可关闭对外访问">API Key</label>
                            <div class="form-row-inline">
                                <input type="text" class="form-input" id="settingsExternalApiKey"
                                    placeholder="留空则禁用对外 API" autocomplete="off" style="flex:1;min-width:220px;">
                                <button type="button" class="btn btn-sm" id="btnGenerateExternalApiKey" onclick="generateExternalApiKey()"
                                    data-tip="使用浏览器安全随机数生成高强度 API Key">🎲 随机生成</button>
                                <button type="button" class="btn btn-sm" id="btnCopyExternalApiKey" onclick="copyExternalApiKey()"
                                    data-tip="复制完整明文 API Key 到剪贴板">📋 复制</button>
                            </div>
                        </div>
                    </div>

                    <div class="settings-section">
                        <div class="settings-section-title">💾 数据库备份</div>
                        <div class="form-row-inline">
                            <button type="button" class="btn btn-sm" id="btnDownloadDatabaseBackup" onclick="downloadDatabaseBackup()"
                                data-tip="导出当前 SQLite 数据库的一致性快照（.db 文件），升级镜像前强烈建议先下载一份备份">📥 下载数据库快照</button>
                            <span id="databaseBackupResult" style="font-size:12.5px;"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn" onclick="hideSettingsModal()">取消</button>
                <button type="button" class="btn btn-primary" id="btnSaveSettings" onclick="saveSettings()"
                    data-tip="保存当前所有设置变更并即时生效">💾 保存设置</button>
            </div>
        </div>
    </div>

    <!-- ==================== 新建 / 编辑分组模态框 ==================== -->
    <div class="modal" id="addGroupModal" onclick="if(event.target === this) hideAddGroupModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="groupModalTitle">添加分组</h3>
                <button type="button" class="modal-close" onclick="hideAddGroupModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="groupName" data-tip="分组展示名称，用于在左侧下拉框中快速切换">分组名称 *</label>
                    <input type="text" class="form-input" id="groupName" placeholder="例如：工作邮箱、主力号">
                </div>
                <div class="form-group">
                    <label class="form-label" for="groupDesc" data-tip="可选的分组用途备注">分组描述</label>
                    <input type="text" class="form-input" id="groupDesc" placeholder="可选备注">
                </div>
                <div class="form-group">
                    <label class="form-label" data-tip="设置该分组下账号的网络代理策略，优先级高于全局代理">代理模式</label>
                    <div class="form-row-inline" style="gap:14px;">
                        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;"
                            data-tip="自动使用「系统设置 → 全局代理」配置；全局代理未开启时直接连接">
                            <input type="radio" name="groupProxyMode" value="inherit" checked onchange="onGroupProxyModeChange()">
                            <span>跟随全局</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;"
                            data-tip="为该分组单独指定独立代理地址，覆盖全局代理">
                            <input type="radio" name="groupProxyMode" value="custom" onchange="onGroupProxyModeChange()">
                            <span>自定义代理</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;"
                            data-tip="即使全局代理已开启，该分组内的账号也强制直接连接网络">
                            <input type="radio" name="groupProxyMode" value="direct" onchange="onGroupProxyModeChange()">
                            <span>强制直连</span>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="groupCustomProxyWrap" style="display:none;">
                    <label class="form-label" for="groupProxyUrl" data-tip="支持 http://、https://、socks4://、socks5://、socks5h://">自定义代理地址</label>
                    <div class="form-row-inline">
                        <input type="text" class="form-input" id="groupProxyUrl" placeholder="http://host:port 或 socks5://host:port" style="flex:1;">
                        <button type="button" class="btn btn-sm" id="btnTestGroupProxy" onclick="testGroupProxy()"
                            data-tip="测试该自定义代理地址的连通性与延迟">🔗 测试</button>
                    </div>
                    <div id="groupProxyTestResult" style="font-size:12px;margin-top:4px;"></div>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" data-tip="选择分组标识色">分组颜色</label>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-option selected" style="background:#2563eb;" data-color="#2563eb"></div>
                        <div class="color-option" style="background:#0d9488;" data-color="#0d9488"></div>
                        <div class="color-option" style="background:#16a34a;" data-color="#16a34a"></div>
                        <div class="color-option" style="background:#d97706;" data-color="#d97706"></div>
                        <div class="color-option" style="background:#7c3aed;" data-color="#7c3aed"></div>
                        <div class="color-option" style="background:#dc2626;" data-color="#dc2626"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger-ghost" id="btnDeleteGroupInModal" onclick="deleteEditingGroup()" style="display:none;margin-right:auto;"
                    data-tip="删除当前分组（组内账号会自动移至默认分组，不会丢失）">删除分组</button>
                <button type="button" class="btn" onclick="hideAddGroupModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveGroup()">保存</button>
            </div>
        </div>
    </div>

    <!-- ==================== 批量导入账号模态框 ==================== -->
    <div class="modal" id="addAccountModal" onclick="if(event.target === this) hideAddAccountModal()">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>＋ 批量导入邮箱</h3>
                <button type="button" class="modal-close" onclick="hideAddAccountModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row-inline" style="gap:12px;margin-bottom:12px;">
                    <div style="flex:1;min-width:180px;">
                        <label class="form-label" for="importModeSelect"
                            data-tip="自动识别支持混合粘贴 Outlook OAuth2 与通用 IMAP 账号；也可手动指定固定类型">导入类型</label>
                        <select class="form-select" id="importModeSelect" onchange="onImportModeChange()">
                            <option value="outlook">Outlook OAuth2（邮箱----密码----ClientID----RefreshToken）</option>
                            <option value="imap">通用 IMAP（邮箱----授权码/密码----服务器----端口）</option>
                        </select>
                    </div>
                    <div style="flex:1;min-width:160px;">
                        <label class="form-label" for="importGroupId"
                            data-tip="指定导入账号归属的分组">导入到分组</label>
                        <select class="form-select" id="importGroupId"></select>
                    </div>
                </div>

                <div class="form-row-inline" id="imapImportServerRow" style="display:none;gap:10px;margin-bottom:12px;">
                    <div style="flex:1.2;">
                        <label class="form-label" for="imapPresetSelect"
                            data-tip="选择常见邮箱预设可自动填充 IMAP 服务器和端口">邮箱服务商</label>
                        <select class="form-select" id="imapPresetSelect" onchange="onImapPresetChange(this.value)">
                            <option value="custom">自定义 IMAP</option>
                            <option value="qq">QQ 邮箱 (imap.qq.com:993)</option>
                            <option value="163">163 邮箱 (imap.163.com:993)</option>
                            <option value="126">126 邮箱 (imap.126.com:993)</option>
                            <option value="gmail">Gmail (imap.gmail.com:993)</option>
                            <option value="aliyun">阿里云邮箱 (imap.aliyun.com:993)</option>
                        </select>
                    </div>
                    <div style="flex:1.5;">
                        <label class="form-label" for="imapImportHost" data-tip="IMAP 服务器域名，如 imap.qq.com">IMAP 服务器</label>
                        <input type="text" class="form-input" id="imapImportHost" placeholder="imap.example.com">
                    </div>
                    <div style="width:92px;">
                        <label class="form-label" for="imapImportPort" data-tip="SSL IMAP 端口，通常为 993">端口</label>
                        <input type="number" class="form-input" id="imapImportPort" value="993">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="batchAccountInput"
                        data-tip="每行一个账号，支持 ---- / --- / : / 空格 分隔；Outlook 格式：邮箱----密码----client_id----refresh_token；IMAP 格式：邮箱----密码">账号列表（每行一个）</label>
                    <textarea class="form-textarea" id="batchAccountInput" rows="8"
                        placeholder="user@outlook.com----password----client_id----refresh_token"></textarea>
                </div>

                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" for="importRemarkInput" data-tip="可选：为本次批量导入的所有账号统一写入备注">统一备注（可选）</label>
                    <input type="text" class="form-input" id="importRemarkInput" placeholder="可选备注">
                </div>
            </div>
            <div class="modal-footer">
                <span id="importProgressHint" style="font-size:12.5px;color:var(--text-secondary);margin-right:auto;"></span>
                <button type="button" class="btn" onclick="hideAddAccountModal()">取消</button>
                <button type="button" class="btn btn-primary" id="btnConfirmImport" onclick="submitBatchImport()"
                    data-tip="解析并导入文本框中的所有账号，已存在的账号会自动更新凭据">确认导入</button>
            </div>
        </div>
    </div>

    <!-- ==================== 编辑账号模态框 ==================== -->
    <div class="modal" id="editAccountModal" onclick="if(event.target === this) hideEditAccountModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ 编辑账号</h3>
                <button type="button" class="modal-close" onclick="hideEditAccountModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editAccountId">
                <input type="hidden" id="editAccountType">
                <div class="form-group">
                    <label class="form-label">邮箱地址</label>
                    <input type="text" class="form-input" id="editAccountEmail" readonly style="background:#f8fafc;">
                </div>
                <div class="form-group">
                    <label class="form-label" for="editAccountGroup" data-tip="调整该账号所属的分组与对应代理策略">所属分组</label>
                    <select class="form-select" id="editAccountGroup"></select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="editAccountRemark" data-tip="自定义备注信息，支持在左侧列表直接搜索">备注</label>
                    <input type="text" class="form-input" id="editAccountRemark" placeholder="输入备注">
                </div>
                <div id="editOutlookFields">
                    <div class="form-group">
                        <label class="form-label" for="editClientId" data-tip="微软应用 Client ID；仅修改备注或分组时无需改动">Client ID</label>
                        <input type="text" class="form-input" id="editClientId" placeholder="保留原值">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editRefreshToken" data-tip="留空表示不修改当前已加密存储的 Refresh Token">Refresh Token</label>
                        <input type="password" class="form-input" id="editRefreshToken" placeholder="留空不修改" autocomplete="off">
                    </div>
                </div>
                <div id="editImapFields" style="display:none;">
                    <div class="form-row-inline" style="gap:10px;margin-bottom:12px;">
                        <div style="flex:1;">
                            <label class="form-label" for="editImapHost" data-tip="IMAP 服务器主机名">IMAP Host</label>
                            <input type="text" class="form-input" id="editImapHost">
                        </div>
                        <div style="width:90px;">
                            <label class="form-label" for="editImapPort" data-tip="SSL IMAP 端口">端口</label>
                            <input type="number" class="form-input" id="editImapPort" value="993">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editImapPassword" data-tip="留空表示不修改当前 IMAP 授权码/密码">IMAP 密码 / 授权码</label>
                        <input type="password" class="form-input" id="editImapPassword" placeholder="留空不修改" autocomplete="off">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" style="cursor:pointer;"
                        data-tip="开启后，若「系统设置 → Telegram 推送」已配置，系统后台轮询到新邮件时会自动推送到 Telegram">
                        <input type="checkbox" id="editTelegramPush" style="accent-color:var(--clr-primary);">
                        <span>启用该邮箱的 Telegram 新邮件推送</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger-ghost" onclick="deleteEditingAccount()" style="margin-right:auto;"
                    data-tip="永久删除该账号">删除账号</button>
                <button type="button" class="btn" onclick="hideEditAccountModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAccountEdit()">保存修改</button>
            </div>
        </div>
    </div>

    <!-- ==================== 导出账号（二次密码校验）模态框 ==================== -->
    <div class="modal" id="exportModal" onclick="if(event.target === this) hideExportModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📤 导出账号</h3>
                <button type="button" class="modal-close" onclick="hideExportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="exportGroupSelect" data-tip="选择要导出的目标分组">选择分组</label>
                    <select class="form-select" id="exportGroupSelect"></select>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" for="exportVerifyPassword"
                        data-tip="导出包含明文凭据，出于安全考虑需要再次输入当前管理员登录密码验证">确认登录密码 *</label>
                    <input type="password" class="form-input" id="exportVerifyPassword" placeholder="请输入当前登录密码">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="hideExportModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmExportGroup()"
                    data-tip="验证密码并下载该分组的账号文本文件">确认导出</button>
            </div>
        </div>
    </div>

    <!-- ==================== 标签管理模态框 ==================== -->
    <div class="modal" id="tagManagementModal" onclick="if(event.target === this) hideTagManagementModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🏷️ 标签管理</h3>
                <button type="button" class="modal-close" onclick="hideTagManagementModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-row-inline" style="margin-bottom:12px;">
                    <input type="text" class="form-input" id="newTagName" placeholder="输入新标签名称" style="flex:1;">
                    <button type="button" class="btn btn-primary btn-sm" onclick="createNewTag()">添加</button>
                </div>
                <div id="tagListContainer" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="hideTagManagementModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- ==================== 批量移动分组模态框 ==================== -->
    <div class="modal" id="batchMoveGroupModal" onclick="if(event.target === this) hideBatchMoveGroupModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📁 批量移动分组</h3>
                <button type="button" class="modal-close" onclick="hideBatchMoveGroupModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label" for="batchMoveGroupSelect">目标分组</label>
                    <select class="form-select" id="batchMoveGroupSelect"></select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="hideBatchMoveGroupModal()">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmBatchMoveGroup()">确认移动</button>
            </div>
        </div>
    </div>

    <!-- ==================== 统一错误详情模态框 ==================== -->
    <div class="modal" id="errorDetailModal" onclick="if(event.target === this) hideErrorDetailModal()">
        <div class="modal-content modal-lg">
            <div class="modal-header" style="background:#fef2f2;border-bottom-color:#fecaca;">
                <h3 id="errorDetailModalTitle" style="color:var(--clr-danger);">❌ 错误详情</h3>
                <button type="button" class="modal-close" onclick="hideErrorDetailModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="errorModalStandardBody">
                    <div class="error-message-box" id="errorModalUserMessage" style="margin-bottom:12px;font-weight:600;"></div>
                    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);margin-bottom:10px;">
                        <span><strong>Code:</strong> <span id="errorModalCode">-</span></span>
                        <span><strong>Type:</strong> <span id="errorModalType">-</span></span>
                        <span><strong>Status:</strong> <span id="errorModalStatus">-</span></span>
                        <span><strong>Trace ID:</strong> <span id="errorModalTraceId">-</span></span>
                    </div>
                    <div class="form-row-inline" style="margin-bottom:8px;">
                        <button type="button" class="btn btn-sm" id="toggleTraceBtn" onclick="toggleStackTrace()">显示技术详情</button>
                        <button type="button" class="btn btn-sm" onclick="copyErrorDetails()">📋 复制详情</button>
                    </div>
                    <div class="error-message-box" id="errorModalDetailsContainer" style="display:none;max-height:180px;">
                        <pre id="errorModalDetails" style="margin:0;white-space:pre-wrap;word-break:break-all;font-size:12px;"></pre>
                    </div>
                </div>
                <div id="errorModalFetchBody" style="display:none;">
                    <div id="emailFetchErrorContent"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="hideErrorDetailModal()">关闭</button>
            </div>
        </div>
    </div>
